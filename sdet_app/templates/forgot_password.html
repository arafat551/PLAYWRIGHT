<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublié - AUTOMATION</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='8' fill='%234f46e5'/%3E%3Cpath d='M10 16.5l4.2 4L22 12.5' stroke='white' stroke-width='2.8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;650;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
    <div class="login-card">
        <div class="login-brand">
            <span class="logo-mark" aria-hidden="true">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            </span>
            <span class="login-title">AUTOMATION</span>
            <span class="login-sub">Réinitialisation du mot de passe</span>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for cat, msg in messages %}
            <div class="flash {{ cat }}">{{ msg }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <label for="email">Adresse e-mail</label>
            <input type="email" id="email" name="email" required placeholder="utilisateur@exemple.com" autofocus>
            <span class="text-muted text-small" style="display:block;margin-bottom:.9rem">Saisissez l'adresse de votre compte : un lien de réinitialisation vous sera envoyé par e-mail.</span>

            <button type="submit" class="btn-primary">Envoyer le lien de réinitialisation</button>
        </form>

        <p style="margin-top:1.1rem;font-size:.8rem;text-align:center">
            <a class="text-muted" href="{{ url_for('login') }}">← Retour à la connexion</a>
        </p>
    </div>
</body>
</html>
