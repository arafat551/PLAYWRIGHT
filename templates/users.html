{% extends "base.html" %}
{% block title %}Utilisateurs{% endblock %}
{% block content %}
<div class="page-header">
    <h1>UTILISATEURS</h1>
    <a href="{{ url_for('user_new') }}" class="btn-primary">+ Ajouter un utilisateur</a>
</div>

<div class="card">
    <table class="data-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Email</th>
                <th>Cree le</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for u in users %}
            <tr>
                <td>{{ u.id }}</td>
                <td>{{ u.email }}</td>
                <td>{{ u.created_at }}</td>
                <td>
                    <button class="btn-sm btn-danger" onclick="deleteUser({{ u.id }}, '{{ u.email }}')">Supprimer</button>
                </td>
            </tr>
            {% endfor %}
            {% if not users %}
            <tr><td colspan="4" class="text-center">Aucun utilisateur</td></tr>
            {% endif %}
        </tbody>
    </table>
</div>

<script>
function deleteUser(id, email) {
    if (confirm('Supprimer l\'utilisateur ' + email + ' ?')) {
        fetch('/users/' + id + '/delete', {method: 'POST'})
            .then(() => location.reload());
    }
}
</script>
{% endblock %}
