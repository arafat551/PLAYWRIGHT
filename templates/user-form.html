{% extends "base.html" %}
{% block title %}Nouvel utilisateur{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Nouvel utilisateur</h1>
</div>

<div class="card form-card">
    <form method="POST">
        <label>Email *</label>
        <input type="email" name="email" required placeholder="utilisateur@email.com">

        <label>Mot de passe *</label>
        <input type="password" name="password" required placeholder="Minimum 6 caracteres">

        <label>Confirmer le mot de passe *</label>
        <input type="password" name="confirm_password" required placeholder="Retapez le mot de passe">

        <div class="form-actions">
            <a href="{{ url_for('users_list') }}" class="btn-secondary">Annuler</a>
            <button type="submit" class="btn-primary">Creer l'utilisateur</button>
        </div>
    </form>
</div>
{% endblock %}
